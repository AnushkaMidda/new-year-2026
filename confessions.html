<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unspoken Confessions</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="confessions.css" />
</head>
<body>

  <!-- CONFETTI BACKGROUND -->
  <div class="confetti-layer"></div>

  <!-- CONFESSIONS CONTAINER -->
  <div class="confessions-container">
    <h1 class="title">What Remains Unspoken</h1>
    <div class="confession-text"></div>

    <!-- User Confession Input -->
    <div class="user-confession">
      <h2>Write your own confession:</h2>
      <textarea id="userInput" placeholder="Type here..." rows="4"></textarea>
      <button id="submitConfession">Add Confession</button>
      <div id="userConfessionDisplay"></div>
    </div>
  </div>

  <!-- JS -->
  <script src="confessions.js"></script>
</body>
</html>
